services:
  vendas-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendas-go
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: vendas_db
      DB_PORT: '5432'
    networks:
      - vendas_network

networks:
  vendas_network:
    external: true
