basePath: /api
definitions:
  models.Cliente:
    properties:
      ativo:
        type: boolean
      cep:
        type: string
      cidade:
        type: string
      criado_em:
        type: string
      documento:
        type: string
      email:
        type: string
      endereco:
        type: string
      estado:
        type: string
      id:
        type: integer
      nome:
        type: string
      numero:
        type: string
      telefone:
        type: string
    type: object
info:
  contact: {}
  description: API de gerenciamento de clientes do sistema Vendas.
  title: Vendas API - Go
  version: "1.0"
paths:
  /cliente_documento:
    get:
      description: Busca um cliente pelo CPF ou CNPJ.
      parameters:
      - description: CPF ou CNPJ do cliente
        in: query
        name: documento
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Cliente'
        "400":
          description: Documento não fornecido
          schema:
            type: string
        "404":
          description: Cliente não encontrado
          schema:
            type: string
      summary: Buscar cliente por documento
      tags:
      - Clientes
  /clientes:
    get:
      description: Retorna uma lista de todos os clientes cadastrados.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Cliente'
            type: array
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Listar todos os clientes
      tags:
      - Clientes
  /clientes_buscar_por_id:
    get:
      consumes:
      - application/json
      description: Retorna um cliente com base no ID fornecido.
      parameters:
      - description: ID do cliente
        format: int64
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Cliente'
        "400":
          description: ID não fornecido
          schema:
            type: string
        "404":
          description: Cliente não encontrado
          schema:
            type: string
      summary: Buscar cliente por ID
      tags:
      - Clientes
swagger: "2.0"
