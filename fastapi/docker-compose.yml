services:
  fastapi:
    build: .
    container_name: vendas_fastapi
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
    ports:
      - '8001:8001'
    environment:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: vendas_db
      DB_PORT: '5432'
    networks:
      - vendas_network

networks:
  vendas_network:
    external: true
